        - heading "Handicap" [level=2] [ref=f6e189]
        - generic [ref=f6e190]:
          - generic [ref=f6e191]:
            - generic [ref=f6e192]: Législation
            - paragraph [ref=f6e193]: La journée a été marquée par plusieurs avancées législatives concernant le handicap. La France a récemment mis en place une réforme sur les fauteuils roulants, soulignant qu'elle rattrape son retard dans ce domaine. Par ailleurs, des discussions autour de l'inclusion des personnes handicapées dans la fonction publique et des questions de responsabilité suite à un incendie dans un gîte accueillant des personnes handicapées ont également été mises en lumière.
          - generic [ref=f6e194]:
            - generic [ref=f6e195]: Handicap à l'école
            - paragraph [ref=f6e196]: Des initiatives éducatives continuent de se développer pour sensibiliser les jeunes au handicap. À la bibliothèque de Vedène, la lecture est utilisée comme un outil de sensibilisation, tandis qu'une enquête du SNALC met en avant les enjeux de la prise en compte du handicap dans l'Éducation Nationale.
          - generic [ref=f6e197]:
            - generic [ref=f6e198]: Handicap en entreprise
            - paragraph [ref=f6e199]: Le secteur de l'emploi pour les personnes en situation de handicap montre des signes positifs, avec des témoignages d'employés épanouis dans des environnements inclusifs. Un restaurant à Niort illustre comment l'intégration professionnelle peut transformer la vie d'une jeune femme atteinte de handicap mental.
          - generic [ref=f6e200]:
            - generic [ref=f6e201]: Sport
            - paragraph [ref=f6e202]: Le sport continue de jouer un rôle crucial dans l'inclusion des personnes en situation de handicap. Des événements tels qu'un tournoi de football adapté et des randonnées en montagne sont organisés pour promouvoir l'accessibilité et le bien-être. Des témoignages d'athlètes, comme celui d'Édith Dassé, soulignent l'impact positif du sport sur la vie des personnes handicapées.
